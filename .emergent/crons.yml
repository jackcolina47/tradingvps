crons:
  - name: ai-review-daily
    description: "Dispara la revisión IA automática de ambos bots (Bybit y HotForex) a las 08:00 UTC; cada backend decide si toca según su frecuencia configurada"
    cron: "0 8 * * *"
    endpoint: "{{BASE_URL}}/api/cron/ai-review"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: weekly-summary
    description: "Envía cada domingo 20:00 UTC el resumen semanal por Telegram de ambos bots (Bybit y HotForex): PnL, pips, mejores y peores pares, filtro IA y plan"
    cron: "0 20 * * 0"
    endpoint: "{{BASE_URL}}/api/cron/weekly-summary"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: backup-nightly
    description: "Crea cada noche a las 03:00 UTC una copia de seguridad completa de la base de datos (ambos bots) y los domingos la envía por Telegram"
    cron: "0 3 * * *"
    endpoint: "{{BASE_URL}}/api/cron/backup"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
