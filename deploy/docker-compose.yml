x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mongo:
    image: ${MONGO_IMAGE:-mongo:7}
    restart: unless-stopped
    <<: *logging
    command: ["--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-0.25}"]
    mem_limit: ${MONGO_MEM:-450m}
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    <<: *logging
    mem_limit: ${BACKEND_MEM:-600m}
    env_file: backend.env
    environment:
      - BACKUP_DIR=/data/backups
      - APP_SOURCE_DIR=/src
    volumes:
      - ./backups:/data/backups
      - ..:/src:ro
    depends_on:
      - mongo
    ports:
      - "127.0.0.1:8001:8001"

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    <<: *logging
    mem_limit: ${WEB_MEM:-128m}
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
